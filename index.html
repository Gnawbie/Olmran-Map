<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land of Olmran — Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="room-graph-root" hidden></div>

  <div id="toolbar">
    <div id="brand" class="panel">Land of Olmran</div>
    <select id="layer-select" class="panel"></select>
    <div id="search-wrap">
      <input id="search-box" class="panel" type="text" placeholder="Jump to zone…" autocomplete="off">
      <div id="search-results" class="panel"></div>
    </div>
    <button id="color-layer-toggle" class="panel" hidden>Color Layer</button>
    <button id="item-browser-toggle" class="panel mod-link" type="button">Items</button>
    <a id="mod-link" class="mod-link panel" href="moderator.html" target="_blank" rel="noopener">Moderator ↗</a>
  </div>

  <div id="filter-chips"></div>

  <div id="item-browser" class="panel">
    <h3>Zone Items</h3>
    <div id="item-browser-body">
      <p style="color: var(--muted); font-size: 12px;">Click a zone on the map, or search for one, to see its items here.</p>
    </div>
  </div>

  <div id="flag-nav" class="panel">
    <div id="flag-nav-header">
      <span>Jump to Area</span>
      <button id="flag-nav-toggle-btn" title="Hide the jump-to-area panel">›</button>
    </div>
    <div id="flag-nav-body">
      <div class="flag-nav-tabs">
        <button class="flag-nav-tab active" data-tab="jump" type="button">Jump</button>
        <button class="flag-nav-tab" data-tab="items" type="button">Items</button>
      </div>
      <div id="flag-nav-tab-jump" class="flag-nav-tab-panel">
        <div class="flag-nav-field">
          <label>Realm</label>
          <div class="flag-nav-combo-wrap">
            <input id="flag-nav-realm-input" type="text" placeholder="Search realms…" autocomplete="off">
            <div id="flag-nav-realm-results" class="flag-nav-results"></div>
          </div>
        </div>
        <div class="flag-nav-field">
          <label>Area</label>
          <div class="flag-nav-combo-wrap">
            <input id="flag-nav-area-input" type="text" placeholder="Pick a realm first…" autocomplete="off" disabled>
            <div id="flag-nav-area-results" class="flag-nav-results"></div>
          </div>
        </div>
      </div>
      <div id="flag-nav-tab-items" class="flag-nav-tab-panel hidden">
        <label class="flag-nav-no-zoom" title="Picking an area from the Jump tab still loads its item list here, but won't move/zoom the map"><input type="checkbox" id="flag-nav-no-zoom-toggle"> Don't zoom to area</label>
        <div id="flag-nav-items-tree" class="flag-nav-items-tree">
          <div class="muted">Pick an area (Jump tab) to see its items.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data/layers.js?v=6"></script>
<script src="js/data/zones.js?v=6"></script>
<script src="js/data/markers.js?v=6"></script>
<script src="js/data/zone-items.js?v=6"></script>
<script src="js/data/area-items.js?v=6"></script>
<script src="js/data/realm-graph/chaos.js?v=6"></script>
<script src="js/data/realm-graph/evil.js?v=6"></script>
<script src="js/data/realm-graph/good.js?v=6"></script>
<script src="js/data/realm-graph/kaid.js?v=6"></script>
<script src="js/room-graph-view.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
